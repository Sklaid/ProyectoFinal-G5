# Flyway Migration Test Configuration
# This profile is specifically for testing Flyway migrations

# Test Database Configuration - H2 in-memory
spring.datasource.url=jdbc:h2:mem:flywaytest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration - Let Flyway manage schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway Configuration - ENABLED for migration tests
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false

# JWT Configuration
jwt.secret=test-secret-key-for-testing-minimum-256-bits-long-string
jwt.expiration=86400000

# Logging
logging.level.com.techcorp=DEBUG
logging.level.org.flywaydb=DEBUG
