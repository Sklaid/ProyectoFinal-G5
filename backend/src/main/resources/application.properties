# Application Configuration
spring.application.name=devops-platform
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/devops_platform
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Initial baseline
spring.flyway.clean-disabled=true
spring.flyway.out-of-order=false
spring.flyway.placeholder-replacement=true

# JWT Configuration
jwt.secret=your-secret-key-change-this-in-production-minimum-256-bits
jwt.expiration=86400000

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Logging
logging.level.com.techcorp=INFO
logging.level.org.springframework.security=INFO
