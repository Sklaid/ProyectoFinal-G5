# SonarQube Project Configuration for Frontend
# This file provides configuration for SonarQube analysis of the React TypeScript frontend

# Project identification
sonar.projectKey=devops-enterprise-platform-frontend
sonar.projectName=DevOps Enterprise Platform - Frontend
sonar.projectVersion=1.0.0

# Source and test directories
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/test/**

# Encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=ts

# Exclusions - files to exclude from analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.config.ts,**/*.config.js,**/vite-env.d.ts

# Coverage exclusions - files to exclude from coverage calculation
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/test/**,**/*.config.ts,**/*.config.js,**/main.tsx,**/vite-env.d.ts

# Test exclusions
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**

# Coverage report paths
# Vitest generates coverage in lcov format
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# TypeScript configuration
sonar.typescript.tsconfigPath=tsconfig.json

# Quality Gate Configuration
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Duplication
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx

# Analysis parameters
sonar.scm.disabled=false
sonar.scm.provider=git

# Logging
sonar.log.level=INFO
sonar.verbose=false

# Additional TypeScript/JavaScript settings
sonar.javascript.node.maxspace=4096
